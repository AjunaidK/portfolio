<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — My website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login" id="loginView" hidden>
    <form class="login-box" id="loginForm">
      <h1>Website admin</h1>
      <p class="muted">Log in to edit your site.</p>
      <label for="lUser">Username<input id="lUser" autocomplete="username" required></label>
      <label for="lPass">Password<input id="lPass" type="password" autocomplete="current-password" required></label>
      <p class="err" id="lErr" hidden></p>
      <button class="btn primary block">Log in</button>
      <a href="/" class="muted small">← Back to the website</a>
    </form>
  </div>

  <div class="app" id="appView" hidden>
    <aside class="side" id="side">
      <div class="brand">Website<span>.</span> <small>admin</small></div>
      <nav id="nav">
        <a data-view="dashboard">Dashboard</a>
        <a data-view="profile">Profile &amp; homepage</a>
        <a data-view="c:projects">Projects</a>
        <a data-view="c:experience">Experience &amp; education</a>
        <a data-view="c:skills">Skills</a>
        <a data-view="c:testimonials">Testimonials</a>
        <a data-view="c:posts">Writing</a>
        <a data-view="messages">Messages <b class="pill" id="unreadPill" hidden></b></a>
        <a data-view="account">Account</a>
      </nav>
      <div class="side-foot">
        <a class="btn ghost block" href="/" target="_blank" rel="noopener">View website ↗</a>
        <button class="btn ghost block" id="logout" type="button">Log out</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <button class="burger" id="burger" type="button" aria-label="Menu">☰</button>
        <h2 id="viewTitle"></h2>
        <div class="top-actions" id="topActions"></div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-box"><button class="x" type="button" data-close aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
